<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Schedule</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
        }
        input, button {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
        }
        .result span {
            font-weight: bold;
        }
        #darkModeToggle {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 10px;
    border: none;
    border-radius: 50%;
    background-color: #007bff;
    color: white;
    cursor: pointer;
    font-size: 1.5em;
    transition: background-color 0.3s;
}

#darkModeToggle:hover {
    background-color: #0056b3;
}

/* Dark Mode Styles */
body.dark-mode {
    background-color: #121212;
    color: whitesmoke; /* Set all text to black in dark mode */
}

body.dark-mode header,
body.dark-mode section,
body.dark-mode footer {
    background: #1e1e1e;
    color: whitesmoke; /* Set all text to black in dark mode */
}

body.dark-mode button {
    background-color: #444;
    color: whitesmoke; /* Set text color to black in dark mode */
}

body.dark-mode #darkModeToggle {
    background-color: #444;
}
body.dark-mode h1,
body.dark-mode h2{
    color: white;
}

    </style>
</head>
<body>
    <button id="darkModeToggle" aria-label="Toggle Dark Mode">🌙</button><button id="home">home</button>
    <div>
        <h1>Sleep Schedule Calculator</h1>
        <p>Please enter your age:</p>
        <input type="number" id="ageInput" placeholder="Enter your age" min="0">
        <button onclick="calculateSleepSchedule()">Submit</button>
        <div id="result" class="result"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const darkModeToggle = document.getElementById('darkModeToggle');
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            }

            darkModeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDarkMode = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            });
            const navigateButton = document.getElementById('home');
            navigateButton.addEventListener('click', () => {
                window.location.href = 'quiet_html.html'; // The URL of the page to navigate to
            });
        });
        function calculateSleepSchedule() {
            const age = parseInt(document.getElementById('ageInput').value, 10);
            const resultDiv = document.getElementById('result');
            let sleepSchedule;

            if (isNaN(age) || age <= 0) {
                resultDiv.innerHTML = '<span style="color: red;">Please enter a valid age.</span>';
                return;
            }

            if (age < 14) {
                sleepSchedule = 'You should sleep from 9 PM to 8 AM.';
            } else if (age >= 14 && age <= 22) {
                sleepSchedule = 'You should sleep from 11 PM to 8 AM.';
            } else {
                sleepSchedule = 'You should sleep from 11 PM to 7 AM.';
            }

            resultDiv.innerHTML = `<span>Recommended Sleep Schedule:</span> ${sleepSchedule}`;
        }
    </script>
</body>
</html>
