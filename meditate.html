<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            text-align: center; /* Center content horizontally */
        }
        h1 {
            margin-bottom: 20px; /* Space between heading and video */
            color: #333; /* Heading text color */
        }
        .video-container {
            display: inline-block; /* Fit the video size */
            display: flex;
            justify-content: center;
        }
        button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* Dark Mode Styles */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.dark-mode h1 {
            color: #e0e0e0;
        }
        body.dark-mode button {
            background-color: #444;
            color: #e0e0e0;
        }
        body.dark-mode button:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <button id="darkModeToggle">🌙</button><button id="home">home</button>
    <div class="container">
        <h1>Meditate With Me</h1>
        <div class="video-container">
            <iframe width="853" height="480" src="https://www.youtube.com/embed/acIpsyTW6SI" title="30 Min. Deep Healing Music for The Body &amp; Soul - Relaxing Music, Meditation Music, Inner Peace" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const darkModeToggle = document.getElementById('darkModeToggle');
            darkModeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
            });
            const navigateButton = document.getElementById('home');
            navigateButton.addEventListener('click', () => {
                window.location.href = 'quiet_html.html'; // The URL of the page to navigate to
            });
        });
    </script>
</body>
</html>
